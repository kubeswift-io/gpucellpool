{{- /*
Nil-safe access: with `helm upgrade --reuse-values --set monitoring.enabled=true`
the monitoring subtree from values.yaml is NOT merged, so every nested key may be
absent. `ternary ... (hasKey ...)` keeps an explicit `enabled: false` working,
where sprig's `default` would swallow the false.
*/ -}}
{{- $mon := .Values.monitoring | default dict }}
{{- $sm := $mon.serviceMonitor | default dict }}
{{- if and $mon.enabled (ternary $sm.enabled true (hasKey $sm "enabled")) }}
# Scrapes the manager's /metrics endpoint (the gpucell_* series plus
# controller-runtime's reconcile and workqueue metrics). Needs the Prometheus
# Operator CRDs; the monitoring.enabled gate keeps a default install free of
# that dependency.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gpucellpool.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpucellpool.labels" . | nindent 4 }}
    {{- with $sm.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels: {{- include "gpucellpool.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $sm.interval | default "30s" }}
      # Every gpucell_* series carries pool and namespace labels describing the POOL.
      # Prometheus overwrites exposed labels with target labels by default, so our
      # namespace was being replaced by the operator's own namespace and ours pushed
      # to exported_namespace — measured against a live Prometheus. Every alert then
      # named the wrong namespace. honorLabels keeps the describing labels, which is
      # exactly what kube-prometheus-stack does for kube-state-metrics, for exactly
      # this reason.
      honorLabels: true
      {{- if .Values.metrics.secure }}
      # The manager serves HTTPS with a self-signed certificate, so verification
      # is skipped.
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      # metrics.secure also AUTHENTICATES scrapers (TokenReview then
      # SubjectAccessReview). A scrape with no credential gets 401, every
      # gpucell_* series disappears, and — because every other alert in this pack
      # is written over those series — the pack goes silently dark. Measured
      # against a live Prometheus, which is how this was found.
      #
      # Prometheus presents its own projected ServiceAccount token from this path.
      bearerTokenFile: {{ $sm.bearerTokenFile | default "/var/run/secrets/kubernetes.io/serviceaccount/token" }}
      {{- end }}
{{- end }}
