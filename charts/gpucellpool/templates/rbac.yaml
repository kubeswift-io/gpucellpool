# The operator's rights in the INFRASTRUCTURE cluster. Note what is absent:
# resource.k8s.io is read-only (this operator never allocates a GPU — KubeSwift
# and the scheduler do), and there is no access to pods or nodes here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpucellpool.fullname" . }}-manager
  labels: {{- include "gpucellpool.labels" . | nindent 4 }}
# The rules themselves are GENERATED from config/rbac/role.yaml by `make manifests`,
# for the same reason the CRD is copied there: a hand-maintained second copy drifts
# silently. It did — the chart shipped without the Cluster API rules, so the operator
# deployed happily and then could not create a single Machine.
rules:
{{- .Files.Get "rules.yaml" | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpucellpool.fullname" . }}-manager
  labels: {{- include "gpucellpool.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpucellpool.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "gpucellpool.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- if .Values.leaderElection }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gpucellpool.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpucellpool.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gpucellpool.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpucellpool.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gpucellpool.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "gpucellpool.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# The role a metrics scraper binds to (#11). Non-resource URLs only: it grants
# nothing in the API, just the right to GET the manager's metrics paths.
#
# Shipped unbound on purpose. Binding it names a specific ServiceAccount in a
# namespace this chart does not know, and silently granting an unnamed principal
# read access would recreate the hole this closes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpucellpool.fullname" . }}-metrics-reader
  labels:
    {{- include "gpucellpool.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
