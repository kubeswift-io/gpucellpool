# The controller image.
image:
  repository: ghcr.io/kubeswift-io/gpucellpool/manager
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# Leader election matters as soon as replicaCount > 1: two reconcilers creating
# cells for one pool would race on a physical GPU.
leaderElection: true

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

nodeSelector: {}
tolerations: []
affinity: {}

# The validating webhook. It is ON by default because the guestTemplate denylist
# is a security control: a cell's launcher pod is privileged in THIS cluster, so a
# bypassed denylist is a privilege escalation rather than a lost convenience.
webhook:
  enabled: true
  port: 9443
  # certManager: let cert-manager issue and rotate the serving certificate.
  # When false, the chart generates a self-signed certificate and reuses the
  # existing one on upgrade (so the caBundle stays valid).
  certManager:
    enabled: false
    issuerRef: {}    # e.g. {name: my-issuer, kind: ClusterIssuer, group: cert-manager.io}

metrics:
  # 0 disables the metrics endpoint.
  bindAddress: ":8443"
  # secure serves over HTTPS with a self-signed certificate AND requires a bearer
  # token whose owner is authorized to GET this path: a TokenReview followed by a
  # SubjectAccessReview, the same two checks controller-runtime's filter makes,
  # done with client-go so the operator does not grow a k8s.io/apiserver
  # dependency for it (measured at +249 compiled packages, a 30% increase).
  #
  # Grant a scraper access by binding it to the metrics-reader ClusterRole this
  # chart ships. The ServiceMonitor template carries the exact command.
  #
  # false serves plain HTTP with NO authentication: a bearer token over cleartext
  # would be worse than none. Use bindAddress "0" to serve nothing at all.
  secure: true

# Prometheus Operator integration and Grafana dashboards. Off by default: on it
# requires the monitoring.coreos.com CRDs, and a default install should not depend
# on them.
monitoring:
  enabled: false
  # ServiceMonitor scraping the manager's /metrics endpoint.
  serviceMonitor:
    enabled: true
    interval: 30s
    # Extra labels for Prometheus instances that select ServiceMonitors by label
    # (e.g. release: kube-prometheus-stack).
    additionalLabels: {}
  # Grafana dashboards as sidecar-discovered ConfigMaps.
  dashboards:
    enabled: true
    # The sidecar discovery label (kube-prometheus-stack's default shown).
    label: grafana_dashboard
    # Namespace for the ConfigMaps. Empty = the release namespace; set it to your
    # Grafana namespace if the sidecar only watches its own (its default).
    namespace: ""
    # Extra annotations, e.g. grafana_folder: KubeSwift.
    annotations: {}
  # Starter alert pack — warning-biased; see docs/observability.md.
  prometheusRule:
    enabled: true
    additionalLabels: {}

# There is deliberately no installCRDs toggle. The CRD ships in crds/, which Helm
# installs unconditionally and never updates, so a flag claiming to control it
# would be a no-op — as one here silently was. Upgrades therefore need the CRD
# applied by hand; NOTES.txt prints the command, docs/upgrading.md explains why,
# and the manager logs the specific fields being dropped if it is skipped.

podAnnotations: {}
podLabels: {}
