# Apply this in the WORKLOAD cluster, then build the kubeconfig referenced by
# GPUCellPool.spec.workloadCluster.kubeconfigSecretRef from this ServiceAccount's
# token. cluster-admin is NOT required — hand over this, not your admin config.
#
# Every verb here has a named consumer in
# docs/design/gpucellpool-reconciliation.md §6. The Phase-4 (drain) rules are
# commented out: enable them when automatic scale-down is in use.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-cell-pool-observer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-cell-pool-observer
rules:
  # Cell correlation + readiness, and applying the identity labels/taints the
  # kubelet may not have set itself.
  #
  # DELETE is not optional and is not a drain feature. Two ALWAYS-ON paths remove a
  # workload Node: reaping a Node left behind by a previous incarnation of a cell
  # (without which the pool reports a phantom Ready cell, or HAMi advertises a GPU
  # that no longer exists), and removing a cell's Node when the cell goes. Grant it
  # or every teardown fails Forbidden and stale Nodes accumulate.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, update, delete]

  # HAMi DevicePlugin-mode accounting: allocations live on pod annotations.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]

  # HAMi DRA-mode accounting: ResourceSlice capacity + ResourceClaim
  # consumedCapacity.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices, resourceclaims]
    verbs: [get, list, watch]

  # Nothing else is needed. In particular this operator does NOT evict pods: it
  # waits for a cell's GPU to be released rather than taking it away, so it needs no
  # pods/eviction right. If a cell must be emptied, drain it with kubectl.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-cell-pool-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-cell-pool-observer
subjects:
  - kind: ServiceAccount
    name: gpu-cell-pool-observer
    namespace: kube-system
