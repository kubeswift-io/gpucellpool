# The cloud-init a cell uses to join YOUR workload cluster.
#
# GPUCellPool ships no default here on purpose (docs/design/gpucellpool-bootstrap.md
# §4): the join blob is distribution-specific and carries your cluster's credential.
# Pick ONE of the two Secrets below (k0s or kubeadm), fill in the placeholders that
# are NOT `{{ }}` tokens (search this file for "FILL IN"), and apply it. Reference
# whichever name you keep from spec.bootstrap.joinSecretRef.
#
# ── The substitution set is CLOSED (internal/bootstrap/render.go) ──────────────
#
#   {{ cellName }}         <pool>-<index>, e.g. inference-0 — becomes the guest
#                          hostname AND the workload Node name
#   {{ poolName }}         the GPUCellPool's name
#   {{ nodeLabels }}       a ready-to-use `k=v,k=v` string: your
#                          spec.workloadCluster.node.labels PLUS the identity
#                          labels (cells.kubeswift.io/{pool,cell,cell-index}) —
#                          pass this straight to --node-labels
#   {{ nodeIPInterface }}  the guestTemplate interface name from cell.nodeIPFrom
#                          (e.g. "node") — for logging only. It is a KubeSwift
#                          interface NAME, not a guest device (not "ens4"), and
#                          cloud-init cannot map one to the other. Derive the
#                          actual address by SUBNET instead — see below.
#   {{ expectedGPUs }}     cell.gpu.count, for the preflight log line
#
# An unknown token (a typo, or one from an older draft of this file) is a
# RENDER ERROR, not a silent pass-through — the operator refuses to create a
# cell from a template it cannot fully substitute.
#
# ── Quote every token in YAML value position ───────────────────────────────────
#
#   hostname: {{ cellName }}     is INVALID YAML — {{...}} parses as a nested
#                                 flow mapping and the file cannot be validated
#                                 before substitution.
#   hostname: "{{ cellName }}"   is valid before AND after substitution.
#
# Every token below is already quoted for this reason. Keep it that way if you
# add more.
#
# ── The node IP must be derived by subnet, with a wait loop ───────────────────
#
# The controller does not know the cell's routable address at render time (DHCP
# on the networkRef NAD assigns it after the guest exists), and KubeSwift
# v0.13.4 does not report a secondary NAD interface's IP at all — only its MAC
# (docs/networking.md). So cloud-init must read it from the guest's own
# interfaces, by subnet, and wait for it to appear:
#
#   for i in $(seq 1 30); do
#     NODE_IP=$(ip -4 -o addr show | awk '/10\.77\.0\./ {split($4,a,"/"); print a[1]; exit}')
#     [ -n "$NODE_IP" ] && break
#     sleep 2
#   done
#   [ -n "$NODE_IP" ] || { echo "no routable address after 60s" >&2; exit 1; }
#
# Replace `10\.77\.0\.` with YOUR NAD's subnet (config/samples/
# network-attachment-definition.yaml uses 10.77.0.0/24). This hardcodes your
# cell subnet into the template — that is the least-bad option available today.
#
# ── containerd 2.x needs the v3 config schema ──────────────────────────────────
#
# k0s >= 1.34 ships containerd 2.x. A drop-in written in the OLDER v1 CRI form
# (`version = 2` with `[plugins."io.containerd.grpc.v1.cri"]`) is REJECTED at
# k0s pre-flight:
#
#   Rejected: unsupported configuration version: expected 3, got 2
#     property=/etc/k0s/containerd.d/nvidia.toml
#   Error: pre-flight checks failed
#
# and the worker service never starts — SILENTLY, from the outside: the VM
# boots, sshd answers, both addresses come up, cloud-init reports success and
# even logs `EXIT=0`, because the JOIN SCRIPT finished; it was the SERVICE it
# installed that refused to start. This cost two cell rebuilds to find. Use the
# v3 form, `[plugins."io.containerd.cri.v1.runtime"]`, as below.
#
# ── DNS breaks once the inner CNI comes up ─────────────────────────────────────
#
# systemd-resolved's stub forwards to the pod-netns dnsmasq (192.168.99.1) by
# default. Once the workload cluster's CNI programs the node, that path stops
# answering while raw egress keeps working — so `apt`/image pulls fail right
# when the join is finishing. Pin an upstream resolver (below) rather than
# trust the default.
#
# ── Without an SSH key, a broken cell is undiagnosable ─────────────────────────
#
# The baked image resets machine-id and host keys, and KubeSwift's Cloud
# Hypervisor drops the serial console entirely when no client is attached — so
# cloud-init's own output is not captured anywhere you can read after the fact.
# `ssh_authorized_keys` is not optional if you want to debug a cell that joins
# wrong.
---
# ═══════════════════════════════════════════════════════════════════════════
# Variant 1: k0s worker join
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: inference-cluster-join-k0s
  namespace: gpu-cells
stringData:
  user-data: |
    #cloud-config
    hostname: "{{ cellName }}"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... FILL IN your public key

    write_files:
      # Pin an upstream resolver before the inner CNI can break the default one.
      - path: /etc/systemd/resolved.conf.d/10-upstream.conf
        content: |
          [Resolve]
          DNS=1.1.1.1 8.8.8.8

      # containerd 2.x / v3 schema — the v1 CRI form is rejected by k0s >= 1.34.
      - path: /etc/k0s/containerd.d/nvidia.toml
        content: |
          [plugins."io.containerd.cri.v1.runtime"]
            enable_cdi = true
            cdi_spec_dirs = ["/etc/cdi", "/var/run/cdi"]
          [plugins."io.containerd.cri.v1.runtime".containerd]
            default_runtime_name = "nvidia"
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia]
            runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia.options]
            BinaryName = "/usr/bin/nvidia-container-runtime"
            SystemdCgroup = true

      # The join script itself. Written to a file, not inlined into runcmd as a
      # flow-sequence list item — cloud-init's runcmd accepts either a plain
      # string or a [cmd, arg, ...] list, and a list item cannot itself hold a
      # multi-line block scalar; a YAML parser rejects it outright.
      - path: /usr/local/bin/gpu-cell-join.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail

          # FILL IN: your NAD's subnet — see network-attachment-definition.yaml
          for i in $(seq 1 30); do
            NODE_IP=$(ip -4 -o addr show | awk '/10\.77\.0\./ {split($4,a,"/"); print a[1]; exit}')
            [ -n "$NODE_IP" ] && break
            sleep 2
          done
          [ -n "$NODE_IP" ] || { echo "no routable address after 60s" >&2; exit 1; }
          echo "gpu-cell: node IP $NODE_IP (interface role: {{ nodeIPInterface }}, expecting {{ expectedGPUs }} GPU(s))"

          # k0s installs one role per cell — mutually exclusive with a
          # controller install, and k0s reset does not clean up a second
          # installed unit, so guard against a stale one before installing.
          if ! systemctl is-enabled k0sworker.service >/dev/null 2>&1; then
            # FILL IN: your k0s join token (a k0s token, NOT a kubeadm bootstrap
            # token — mint it with `k0s token create --role=worker` on the
            # control plane, then paste the resulting blob here as one line).
            echo "FILL_IN_K0S_JOIN_TOKEN_BASE64" | base64 -d > /etc/k0s-join-token

            k0s install worker \
              --token-file=/etc/k0s-join-token \
              --labels="{{ nodeLabels }}" \
              --kubelet-extra-args="--node-ip=${NODE_IP}"
            systemctl enable --now k0sworker.service
          fi

    runcmd:
      - systemctl restart systemd-resolved
      - /usr/local/bin/gpu-cell-join.sh
---
# ═══════════════════════════════════════════════════════════════════════════
# Variant 2: kubeadm join
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: inference-cluster-join-kubeadm
  namespace: gpu-cells
stringData:
  user-data: |
    #cloud-config
    hostname: "{{ cellName }}"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... FILL IN your public key

    write_files:
      - path: /etc/systemd/resolved.conf.d/10-upstream.conf
        content: |
          [Resolve]
          DNS=1.1.1.1 8.8.8.8

      # containerd 2.x / v3 schema. If your kubeadm distribution ships
      # containerd 1.7, use the v1 CRI form instead
      # ([plugins."io.containerd.grpc.v1.cri"]) — check `containerd --version`
      # on a control-plane node before assuming this one applies.
      - path: /etc/containerd/conf.d/nvidia.toml
        content: |
          [plugins."io.containerd.cri.v1.runtime"]
            enable_cdi = true
            cdi_spec_dirs = ["/etc/cdi", "/var/run/cdi"]
          [plugins."io.containerd.cri.v1.runtime".containerd]
            default_runtime_name = "nvidia"
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia]
            runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia.options]
            BinaryName = "/usr/bin/nvidia-container-runtime"
            SystemdCgroup = true

      # The join script itself. Written to a file, not inlined into runcmd as a
      # flow-sequence list item — cloud-init's runcmd accepts either a plain
      # string or a [cmd, arg, ...] list, and a list item cannot itself hold a
      # multi-line block scalar; a YAML parser rejects it outright.
      - path: /usr/local/bin/gpu-cell-join.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail

          # FILL IN: your NAD's subnet.
          for i in $(seq 1 30); do
            NODE_IP=$(ip -4 -o addr show | awk '/10\.77\.0\./ {split($4,a,"/"); print a[1]; exit}')
            [ -n "$NODE_IP" ] && break
            sleep 2
          done
          [ -n "$NODE_IP" ] || { echo "no routable address after 60s" >&2; exit 1; }
          echo "gpu-cell: node IP $NODE_IP (interface role: {{ nodeIPInterface }}, expecting {{ expectedGPUs }} GPU(s))"

          # FILL IN: your control-plane endpoint, token and CA hash —
          #   kubeadm token create --print-join-command
          # on a control-plane node prints all three.
          kubeadm join FILL_IN_ENDPOINT:6443 \
            --token FILL_IN_TOKEN \
            --discovery-token-ca-cert-hash sha256:FILL_IN_CA_HASH \
            --node-name "{{ cellName }}" \
            --kubelet-extra-args "--node-ip=${NODE_IP} --node-labels={{ nodeLabels }}"

    runcmd:
      - systemctl restart systemd-resolved containerd
      - /usr/local/bin/gpu-cell-join.sh
