---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-cells-kubeswift-io-v1alpha1-gpucellpool
  failurePolicy: Fail
  name: vgpucellpool.kb.io
  rules:
  - apiGroups:
    - cells.kubeswift.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gpucellpools
  sideEffects: None
