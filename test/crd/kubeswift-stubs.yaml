# Minimal, TEST-ONLY stand-ins for the two KubeSwift kinds this operator talks to.
#
# These are hand-written here rather than copied from KubeSwift for two reasons:
# the licence boundary (KubeSwift is AGPL-3.0, this repo is Apache-2.0, and we
# depend on nothing but the GVKs and a handful of status paths), and honesty —
# the operator must work against whatever schema a real cluster has, so pinning a
# copy of KubeSwift's CRDs in our tests would prove less than this does.
#
# Schemas are intentionally open: the reconciler reads a small set of status
# paths (see internal/provisioner.observe) and writes an opaque spec.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: swiftguests.swift.kubeswift.io
spec:
  group: swift.kubeswift.io
  scope: Namespaced
  names:
    kind: SwiftGuest
    listKind: SwiftGuestList
    plural: swiftguests
    singular: swiftguest
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: swiftseedprofiles.seed.kubeswift.io
spec:
  group: seed.kubeswift.io
  scope: Namespaced
  names:
    kind: SwiftSeedProfile
    listKind: SwiftSeedProfileList
    plural: swiftseedprofiles
    singular: swiftseedprofile
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
